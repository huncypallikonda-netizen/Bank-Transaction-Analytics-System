<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSight Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand" href="#">BankSight</a><div><span id="welcome" class="text-white me-3"></span><button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button></div></div></nav><main class="container py-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><h1 class="h3">Transaction overview</h1><p class="muted mb-0">Monitor activity, patterns and alerts.</p></div><button id="refreshBtn" class="btn btn-primary">Refresh data</button></div><div class="row g-3 mb-4"><div class="col-md-4"><div class="metric"><span>Total transactions</span><strong id="totalCount">—</strong></div></div><div class="col-md-4"><div class="metric"><span>Total transaction value</span><strong id="totalAmount">—</strong></div></div><div class="col-md-4"><div class="metric"><span>Flagged transactions</span><strong id="flaggedCount">—</strong></div></div></div><div class="row g-3"><div class="col-lg-7"><section class="panel"><h2 class="h5">Recent transactions</h2><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody id="transactionRows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></div><div class="col-lg-5"><section class="panel"><h2 class="h5">Monthly activity</h2><img id="chartImage" class="img-fluid" alt="Monthly transaction chart" src=""></section><section class="panel mt-3"><h2 class="h5">Security alerts</h2><ul id="alertList" class="mb-0"><li>Loading…</li></ul></section></div></div><section class="panel mt-3"><h2 class="h5">Add transaction</h2><form id="transactionForm" class="row g-2"><div class="col-md-3"><input class="form-control" id="txType" placeholder="Type (deposit/withdrawal)" required></div><div class="col-md-3"><input class="form-control" id="txAmount" type="number" min="0.01" step="0.01" placeholder="Amount" required></div><div class="col-md-4"><input class="form-control" id="txDescription" placeholder="Description"></div><div class="col-md-2"><button class="btn btn-success w-100">Add</button></div></form><p id="formMessage" class="small mt-2" role="status"></p></section></main><script src="js/config.js"></script><script src="js/dashboard.js"></script></body></html>
